name: Nightly API tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  api-tests-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      TARGET_ENV: staging
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_API_VERSION: ${{ secrets.STRIPE_API_VERSION }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      NOTIFY_ENABLED: ${{ secrets.NOTIFY_ENABLED }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
      NOTIFY_ONLY_ON_FAILURE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: playwright-report/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-results
          path: allure-results/

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-json
          path: test-results.json
